<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover</title>
<style>
  @page { size: {{PAGE_W}} {{PAGE_H}}; margin: 0; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
  body {
    background: linear-gradient(160deg, #0B1D33 0%, #13325A 55%, #1C4A80 100%);
    color: #FFFFFF; font-family: "Inter", "DejaVu Sans", sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
    position: relative; overflow: hidden;
  }
  .art { position: absolute; inset: 0; width: 100%; height: 100%; }
  .text { position: absolute; left: 9%; right: 9%; top: 9%; }
  .edition {
    display: inline-block; font-size: 2.1vh; letter-spacing: 0.25em; text-transform: uppercase;
    color: #9CC3F0; border: 1px solid #5C8FCB; padding: 0.6vh 1.4vh; border-radius: 0.6vh;
  }
  h1 { font-size: 7.2vh; line-height: 1.05; font-weight: 800; margin: 3.5vh 0 2.5vh; letter-spacing: -0.01em; }
  .subtitle { font-size: 2.7vh; line-height: 1.35; color: #CFE0F5; font-weight: 400; max-width: 90%; }
  .author { position: absolute; left: 9%; bottom: 6%; font-size: 3vh; font-weight: 600; letter-spacing: 0.04em; }
  .formula { position: absolute; right: 9%; bottom: 6.4%; font-size: 2.1vh; color: #9CC3F0; font-family: "DejaVu Serif", serif; }
</style>
</head>
<body>
<svg class="art" viewBox="0 0 1000 1500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5C8FCB"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F2A65A"/></marker>
  </defs>
  <!-- faint grid -->
  <g stroke="#2A5288" stroke-width="1" opacity="0.45">
    <path d="M0 950H1000M0 1050H1000M0 1150H1000M0 1250H1000"/>
    <path d="M100 900V1320M200 900V1320M300 900V1320M400 900V1320M500 900V1320M600 900V1320M700 900V1320M800 900V1320M900 900V1320"/>
  </g>
  <!-- word vectors fanning out from an origin -->
  <g stroke="#5C8FCB" stroke-width="3" fill="none">
    <path d="M160 1260L410 990" marker-end="url(#a)"/>
    <path d="M160 1260L520 1000" marker-end="url(#a)"/>
    <path d="M160 1260L610 1080" marker-end="url(#a)"/>
    <path d="M160 1260L680 1170" marker-end="url(#a)"/>
    <path d="M160 1260L690 1250" marker-end="url(#a)"/>
  </g>
  <path d="M160 1260L700 960" stroke="#F2A65A" stroke-width="5" fill="none" marker-end="url(#b)"/>
  <circle cx="160" cy="1260" r="9" fill="#FFFFFF"/>
  <!-- attention grid -->
  <g transform="translate(760 985)">
    <rect x="0" y="0" width="40" height="40" fill="#F2A65A" opacity="0.95"/>
    <rect x="0" y="44" width="40" height="40" fill="#F2A65A" opacity="0.45"/><rect x="44" y="44" width="40" height="40" fill="#F2A65A" opacity="0.6"/>
    <rect x="0" y="88" width="40" height="40" fill="#F2A65A" opacity="0.15"/><rect x="44" y="88" width="40" height="40" fill="#F2A65A" opacity="0.75"/><rect x="88" y="88" width="40" height="40" fill="#F2A65A" opacity="0.25"/>
    <rect x="0" y="132" width="40" height="40" fill="#F2A65A" opacity="0.1"/><rect x="44" y="132" width="40" height="40" fill="#F2A65A" opacity="0.3"/><rect x="88" y="132" width="40" height="40" fill="#F2A65A" opacity="0.55"/><rect x="132" y="132" width="40" height="40" fill="#F2A65A" opacity="0.25"/>
    <g fill="none" stroke="#2A5288"><rect x="44" y="0" width="40" height="40"/><rect x="88" y="0" width="40" height="40"/><rect x="132" y="0" width="40" height="40"/><rect x="88" y="44" width="40" height="40"/><rect x="132" y="44" width="40" height="40"/><rect x="132" y="88" width="40" height="40"/></g>
  </g>
</svg>
<div class="text">
  <span class="edition">{{EDITION}}</span>
  <h1>{{TITLE}}</h1>
  <div class="subtitle">{{SUBTITLE}}</div>
</div>
<div class="author">{{AUTHOR}}</div>
<div class="formula">softmax(QK&#7488;/&#8730;d)&#8201;V</div>
</body>
</html>
